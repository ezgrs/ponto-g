<article class="flex items-center justify-between gap-3 rounded-lg border border-slate-200 bg-white p-3 transition hover:border-slate-300">
    <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-slate-100 text-xs font-semibold text-slate-700">
            {{ initials() }}
        </div>
        <div class="min-w-0">
            <h3 class="truncate text-sm font-semibold text-slate-950">{{ employee.name }}</h3>
            <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-500">
                <span>{{ employee.role }}</span>
                <span aria-hidden="true">/</span>
                <span>{{ employee.code }}</span>
            </div>
        </div>
    </div>

    <button
        type="button"
        (click)="remove.emit()"
        class="rounded-md border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
        [attr.aria-label]="'Remover ' + employee.name"
    >
        Remover
    </button>
</article>
